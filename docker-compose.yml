services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000/api"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "4000"
      FRONTEND_URL: "http://localhost:3000"
      TEMPLATE_DB_URL: "postgresql://admin:12345678@database:5432/db"
      COUNTERSCREEN_TIMEOUT_MS: "30000"
      COUNTERSCREEN_REJECT_UNAUTHORIZED: "false"
      COUNTERSCREEN_CACHE_TTL_SECONDS: "300"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      TSC_WATCHFILE: "PriorityPollingInterval"
      TSC_WATCHDIRECTORY: "RecursiveDirectoryUsingPolling"
      WATCHPACK_POLLING: "true"
    command: ["npm", "run", "start:all"]
    ports:
      - "4000:4000"
      - "5555:5555"
    volumes:
      - ./backend:/app
      - /app/node_modules

  database:
    image: postgres:18
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "12345678"
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - pg_data_18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data_18:
